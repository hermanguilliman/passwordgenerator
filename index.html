        <script>
            // Инициализация темы до отрисовки (без мигания)
            (function () {
                try {
                    var t = localStorage.getItem("gpass_theme");
                    if (!t) {
                        t = window.matchMedia(
                            "(prefers-color-scheme: light)"
                        ).matches
                            ? "light"
                            : "dark";
                    }
                    document.documentElement.setAttribute("data-theme", t);
                } catch (e) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            })();
        </script>
